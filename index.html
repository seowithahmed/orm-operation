<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORM Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eff2f5;
  --surface:#fff;
  --ink:#14202b;
  --ink-2:#4a5b6b;
  --ink-3:#7d8b98;
  --rule:#d3dae2;
  --rule-2:#e5eaee;
  --blue:#1b5e8c;
  --blue-soft:#e3edf4;
  --live:#1b7a4b;
  --live-soft:#e0f0e7;
  --warn:#b26a00;
  --warn-soft:#fbeed8;
  --fail:#b3261e;
  --fail-soft:#fbe4e2;
  --rail:224px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.chrome{font-family:Archivo,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

.rail{
  background:var(--ink);color:#c9d4de;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{font-family:Archivo;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;display:block}
.brand span{font-size:11.5px;color:#7f909f}
.nav{padding:10px 0;flex:1;overflow-y:auto}
.nav a{
  display:flex;align-items:center;gap:10px;
  padding:8px 18px;color:#c9d4de;text-decoration:none;
  font-size:13.5px;border-left:3px solid transparent;
}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(255,255,255,.09);color:#fff;border-left-color:#5aa9dd;font-weight:600}
.nav a .ct{margin-left:auto;font-size:11.5px;color:#7f909f;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:9px}
.nav a.on .ct{color:#dbe6ee}
.nav .grp{padding:14px 18px 5px;font-size:10.5px;letter-spacing:.06em;color:#66788a;font-family:Archivo;font-weight:600}
.railfoot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px}
.railfoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7f909f;margin-right:6px;vertical-align:middle}
.railfoot.ok .dot{background:#4fbf85}
.railfoot.bad .dot{background:#e2685e}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:14px 26px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:20;
}
.topbar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.topbar .spacer{flex:1}
.wrap{padding:22px 26px 60px;max-width:1400px;width:100%}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;
}
.btn:hover{background:#f6f8fa;border-color:#b9c4cf}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px
}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#164e75}
.btn.danger{color:var(--fail);border-color:#e8bcb8}
.btn.danger:hover{background:var(--fail-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- counters ---------- */
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin-bottom:22px}
.counter{background:var(--surface);padding:13px 15px}
.counter .n{font-family:Archivo;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.counter .l{font-size:12px;color:var(--ink-3);margin-top:2px}
.counter.alert .n{color:var(--fail)}
.counter.warn .n{color:var(--warn)}
.counter.good .n{color:var(--live)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:7px;margin-bottom:22px;overflow:hidden}
.panel > header{
  padding:12px 16px;border-bottom:1px solid var(--rule-2);
  display:flex;align-items:center;gap:10px;
}
.panel > header h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel > header .note{font-size:12px;color:var(--ink-3)}
.panel > header .spacer{flex:1}
.panel .body{padding:16px}

/* ---------- tables ---------- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-family:Archivo;font-weight:600;font-size:11.5px;
  color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--rule);
  white-space:nowrap;background:#fafbfc;position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfc}
td.num,th.num{text-align:right}
td.act{text-align:right;white-space:nowrap}
.mono-id{font-weight:600;font-size:12.5px}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.neut{background:#eceff2;color:var(--ink-2)}
.pill.info{background:var(--blue-soft);color:var(--blue)}

/* ---------- coverage grid (the centrepiece) ---------- */
.cov{display:flex;flex-direction:column}
.cov-row{display:grid;grid-template-columns:150px 110px 1fr 150px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--rule-2)}
.cov-row:last-child{border-bottom:0}
.cov-row.head{background:#fafbfc;border-bottom:1px solid var(--rule);font-family:Archivo;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.cov-plat{font-weight:600}
.cov-svc{color:var(--ink-2);font-size:12.5px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{
  min-width:132px;padding:6px 9px;border-radius:5px;font-size:12px;line-height:1.3;
  border:1px solid var(--rule);background:#fafbfc;
}
.slot .who{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sc{color:var(--ink-3);font-size:11.5px}
.slot.filled{background:var(--live-soft);border-color:#b4dcc6}
.slot.filled .sc{color:#3c7d5c}
.slot.empty{border-style:dashed;color:var(--ink-3);display:flex;align-items:center;justify-content:center;min-height:38px}
.cov-risk{font-size:12px;font-weight:600;text-align:right}
.cov-risk.ok{color:var(--live)}
.cov-risk.thin{color:var(--warn)}
.cov-risk.bare{color:var(--fail)}

/* ---------- attention queue ---------- */
.q{list-style:none;margin:0;padding:0}
.q li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--rule-2)}
.q li:last-child{border-bottom:0}
.q .tag{flex:0 0 88px;font-size:11px;font-weight:700;font-family:Archivo;padding-top:2px}
.q .tag.fail{color:var(--fail)}
.q .tag.warn{color:var(--warn)}
.q .tag.info{color:var(--blue)}
.q .txt{flex:1;min-width:0}
.q .txt b{font-weight:600}
.q .txt .meta{color:var(--ink-3);font-size:12px;margin-top:1px}

/* ---------- empty / loading ---------- */
.empty{padding:38px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-family:Archivo;font-size:14px;margin-bottom:5px}
.empty .btn{margin-top:14px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(20,32,43,.45);display:none;z-index:60;padding:32px 16px;overflow-y:auto}
.veil.on{display:block}
.modal{background:var(--surface);border-radius:9px;max-width:720px;margin:0 auto;box-shadow:0 18px 48px rgba(20,32,43,.28)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center}
.modal header h3{margin:0;font-size:15px;font-weight:600}
.modal header .spacer{flex:1}
.modal .fields{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{
  border:1px solid var(--rule);border-radius:5px;padding:7px 9px;font-size:13px;background:#fff;width:100%
}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--ink-3)}

/* ---------- settings ---------- */
.setup{max-width:640px}
.setup .field{margin-bottom:16px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 22px}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 30px;font-size:13.5px;color:var(--ink-2)}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;
  width:20px;height:20px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  font-family:Archivo;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.steps li b{color:var(--ink)}
code{background:#eceff2;padding:1px 5px;border-radius:3px;font-size:12.5px}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--fail)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:0;padding:0 16px}
.tabs button{
  border:0;background:none;padding:10px 13px;cursor:pointer;font-size:13px;font-weight:500;
  color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px
}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}

.searchbar{display:flex;gap:8px;align-items:center}
.searchbar input{border:1px solid var(--rule);border-radius:5px;padding:6px 10px;font-size:13px;width:210px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .nav{display:flex;overflow-x:auto;padding:0}
  .nav .grp,.nav a .ct{display:none}
  .nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .nav a.on{border-left:0;border-bottom-color:#5aa9dd}
  .railfoot{display:none}
  .wrap,.topbar{padding-left:16px;padding-right:16px}
  .modal .fields{grid-template-columns:1fr}
  .cov-row{grid-template-columns:1fr;gap:8px}
  .cov-risk{text-align:left}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <b>ORM Operations</b>
      <span id="brandSub">Vendor &amp; delivery control</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot" id="conn"><span class="dot"></span><span id="connTxt">Not connected</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Board</h1>
        <div class="sub" id="viewSub">&nbsp;</div>
      </div>
      <div class="spacer"></div>
      <div class="searchbar" id="searchWrap" style="display:none">
        <input id="search" type="search" placeholder="Filter rows" aria-label="Filter rows">
      </div>
      <button class="btn" id="refreshBtn">Refresh</button>
      <button class="btn pri" id="addBtn" style="display:none">Add</button>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<div class="veil" id="veil"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <header><h3 id="modalTitle">Edit</h3><div class="spacer"></div><button class="btn sm" id="closeModal">Close</button></header>
  <div class="fields" id="modalFields"></div>
  <footer>
    <button class="btn danger" id="deleteRow" style="display:none">Delete</button>
    <button class="btn" id="cancelModal">Cancel</button>
    <button class="btn pri" id="saveRow">Save</button>
  </footer>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   Config — stored locally in this browser only
   ============================================================ */
var CFG = { url:"", key:"" };
try {
  CFG.url = localStorage.getItem("orm.url") || "";
  CFG.key = localStorage.getItem("orm.key") || "";
} catch(e){}
function saveCfg(){ try{ localStorage.setItem("orm.url",CFG.url); localStorage.setItem("orm.key",CFG.key); }catch(e){} }

/* ============================================================
   Schema — add a column in the Sheet, add a line here, done
   ============================================================ */
var T = {
  text:"text", num:"number", date:"date", sel:"select", url:"url", email:"email", area:"textarea", tel:"tel"
};

var STATUS = {
  vendor:["Active","Testing","Backup","Paused","Blacklisted","Inactive"],
  order:["New","Awaiting Payment","Ready","Assigned","In Progress","Submitted","Partially Delivered","Completed","On Hold","Cancelled"],
  deliv:["Pending","Assigned","In Progress","Submitted","Live","Removed","Replacement Requested","Replaced","Failed","Verified"],
  pay:["Unpaid","Partial","Paid","Overdue"],
  platform:["Reddit","Quora","Trustpilot","Facebook","Google","YouTube","Medium","Press Release"],
  service:["Posts","Comments","Reviews","Answers","Articles","Video Comments","Press Releases","Other"],
  method:["Bank Transfer","PayPal","Credit Card","Check","Cryptocurrency"],
  priority:["High","Medium","Low"],
  yesno:["No","Yes"]
};

var SCHEMA = {
  vendors:{
    sheet:"Vendors", label:"Vendors", singular:"vendor",
    cols:["Vendor ID","Vendor Name","Platforms Offered","Primary Service","Price Per Unit","Overall Score","Status","WhatsApp","Telegram"],
    fields:[
      {k:"Vendor ID",t:T.text,ro:true,hint:"Left blank, the Sheet assigns the next ID."},
      {k:"Vendor Name",t:T.text,req:true},
      {k:"Contact Name",t:T.text},
      {k:"Email",t:T.email},
      {k:"WhatsApp",t:T.tel,hint:"Include country code."},
      {k:"Telegram",t:T.text},
      {k:"Website/Profile",t:T.url},
      {k:"Platforms Offered",t:T.text,req:true,hint:"Comma-separated, e.g. Reddit, Facebook"},
      {k:"Primary Service",t:T.sel,opts:STATUS.service},
      {k:"Secondary Services",t:T.text},
      {k:"Pricing Model",t:T.sel,opts:["Per-unit","Per-order","Retainer"]},
      {k:"Price Per Unit",t:T.num},
      {k:"Currency",t:T.sel,opts:["USD","EUR","GBP","PKR","INR","AED"]},
      {k:"Minimum Order",t:T.num},
      {k:"Turnaround Days",t:T.num},
      {k:"Replacement Policy",t:T.area,wide:true},
      {k:"Payment Terms",t:T.sel,opts:["Prepay","50/50","Net-15","Net-30"]},
      {k:"Quality Rating",t:T.num,hint:"1 to 5"},
      {k:"Reliability Rating",t:T.num,hint:"1 to 5"},
      {k:"Communication Rating",t:T.num,hint:"1 to 5"},
      {k:"Status",t:T.sel,opts:STATUS.vendor,req:true},
      {k:"Date Added",t:T.date},
      {k:"Last Contacted",t:T.date},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  clients:{
    sheet:"Clients", label:"Clients", singular:"client",
    cols:["Client ID","Client Name","Website","Campaign Status","Budget","Payment Status","WhatsApp"],
    fields:[
      {k:"Client ID",t:T.text,ro:true},
      {k:"Client Name",t:T.text,req:true},
      {k:"Website",t:T.url},
      {k:"Industry",t:T.text},
      {k:"Contact Name",t:T.text},
      {k:"Email",t:T.email},
      {k:"WhatsApp",t:T.tel},
      {k:"Telegram",t:T.text},
      {k:"Campaign Status",t:T.sel,opts:["Active","Paused","Completed"],req:true},
      {k:"Services Used",t:T.text,wide:true},
      {k:"Start Date",t:T.date},
      {k:"Budget",t:T.num},
      {k:"Budget Type",t:T.sel,opts:["Monthly","Project","Retainer"]},
      {k:"Payment Status",t:T.sel,opts:STATUS.pay},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  orders:{
    sheet:"Orders", label:"Orders", singular:"order",
    cols:["Order ID","Client Name","Platform","Service","Quantity","Vendor","Vendor Cost","Client Price","Deadline","Status"],
    fields:[
      {k:"Order ID",t:T.text,ro:true},
      {k:"Client ID",t:T.sel,ref:"clients",req:true},
      {k:"Campaign",t:T.text,wide:true},
      {k:"Platform",t:T.sel,opts:STATUS.platform,req:true},
      {k:"Service",t:T.text,req:true},
      {k:"Quantity",t:T.num,req:true},
      {k:"Vendor",t:T.sel,ref:"vendors",req:true},
      {k:"Vendor Cost",t:T.num,hint:"What you pay the vendor."},
      {k:"Client Price",t:T.num,hint:"What the client pays you."},
      {k:"Order Date",t:T.date},
      {k:"Deadline",t:T.date},
      {k:"Status",t:T.sel,opts:STATUS.order,req:true},
      {k:"Client Payment",t:T.sel,opts:STATUS.pay},
      {k:"Vendor Payment",t:T.sel,opts:STATUS.pay},
      {k:"Priority",t:T.sel,opts:STATUS.priority},
      {k:"Requirements",t:T.area,wide:true},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  deliverables:{
    sheet:"Deliverables", label:"Deliverables", singular:"deliverable",
    cols:["Deliverable ID","Order ID","Platform","Vendor","Status","Live URL","Date Verified Live"],
    fields:[
      {k:"Deliverable ID",t:T.text,ro:true},
      {k:"Order ID",t:T.sel,ref:"orders",req:true},
      {k:"Platform",t:T.sel,opts:STATUS.platform,req:true},
      {k:"Service",t:T.text},
      {k:"Vendor",t:T.sel,ref:"vendors",req:true},
      {k:"Status",t:T.sel,opts:STATUS.deliv,req:true},
      {k:"Live URL",t:T.url,wide:true},
      {k:"Date Submitted",t:T.date},
      {k:"Date Verified Live",t:T.date},
      {k:"Removal Date",t:T.date},
      {k:"Removal Reason",t:T.sel,opts:["","Spam Filter","Moderation","Policy Violation","Author Deleted","Unknown"]},
      {k:"Replacement Required",t:T.sel,opts:STATUS.yesno},
      {k:"Replacement URL",t:T.url,wide:true},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  invoices:{
    sheet:"Payments - Client", label:"Client invoices", singular:"invoice",
    cols:["Invoice ID","Order ID","Client","Amount","Amount Received","Due Date","Status"],
    fields:[
      {k:"Invoice ID",t:T.text,ro:true},
      {k:"Order ID",t:T.sel,ref:"orders",req:true},
      {k:"Client",t:T.text,req:true},
      {k:"Amount",t:T.num,req:true},
      {k:"Invoice Date",t:T.date},
      {k:"Due Date",t:T.date},
      {k:"Amount Received",t:T.num},
      {k:"Payment Date",t:T.date},
      {k:"Status",t:T.sel,opts:STATUS.pay,req:true},
      {k:"Method",t:T.sel,opts:STATUS.method},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  bills:{
    sheet:"Payments - Vendor", label:"Vendor bills", singular:"bill",
    cols:["Payment ID","Order ID","Vendor","Amount Owed","Amount Paid","Due Date","Status"],
    fields:[
      {k:"Payment ID",t:T.text,ro:true},
      {k:"Order ID",t:T.sel,ref:"orders",req:true},
      {k:"Vendor",t:T.sel,ref:"vendors",req:true},
      {k:"Amount Owed",t:T.num,req:true},
      {k:"Invoice Date",t:T.date},
      {k:"Due Date",t:T.date},
      {k:"Amount Paid",t:T.num},
      {k:"Payment Date",t:T.date},
      {k:"Status",t:T.sel,opts:STATUS.pay,req:true},
      {k:"Method",t:T.sel,opts:STATUS.method},
      {k:"Notes",t:T.area,wide:true}
    ]
  },
  services:{
    sheet:"Services Catalog", label:"Service catalog", singular:"service",
    cols:["Service ID","Platform","Service Name","Turnaround (Days)","Default Vendor","Backup Vendor","Base Cost","Status"],
    fields:[
      {k:"Service ID",t:T.text,ro:true},
      {k:"Platform",t:T.sel,opts:STATUS.platform,req:true},
      {k:"Service Name",t:T.text,req:true},
      {k:"Description",t:T.area,wide:true},
      {k:"Turnaround (Days)",t:T.num},
      {k:"Default Vendor",t:T.sel,ref:"vendors"},
      {k:"Backup Vendor",t:T.sel,ref:"vendors"},
      {k:"Base Cost",t:T.num},
      {k:"Client Markup %",t:T.text},
      {k:"Status",t:T.sel,opts:["Active","Inactive"]}
    ]
  }
};

var DATA = {};        // sheet name -> rows
var VIEW = "board";

/* ============================================================
   API
   ============================================================ */
function api(payload){
  if(!CFG.url) return Promise.reject(new Error("No Apps Script URL set. Open Settings."));
  payload.key = CFG.key;
  return fetch(CFG.url,{
    method:"POST",
    // text/plain keeps this a "simple" request, so no CORS preflight
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j || j.ok!==true) throw new Error((j&&j.error) || "The API returned an unexpected response.");
    return j;
  });
}

function loadAll(){
  setConn("busy","Loading");
  return api({action:"loadAll"}).then(function(j){
    DATA = j.data || {};
    setConn("ok","Connected");
    return DATA;
  }).catch(function(e){
    setConn("bad", e.message.slice(0,40));
    throw e;
  });
}

function setConn(state,txt){
  var el=document.getElementById("conn");
  el.className="railfoot"+(state==="ok"?" ok":state==="bad"?" bad":"");
  document.getElementById("connTxt").textContent=txt;
}

/* ============================================================
   Small helpers
   ============================================================ */
function rows(key){ return DATA[SCHEMA[key].sheet] || []; }
function el(tag,attrs,kids){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="html") n.innerHTML=attrs[k];
    else if(k==="text") n.textContent=attrs[k];
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function num(v){ var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function money(v){ return "$"+num(v).toLocaleString(undefined,{maximumFractionDigits:0}); }
function parseDate(v){
  if(!v) return null;
  var s=String(v).trim(); if(!s) return null;
  var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  var d=new Date(s); return isNaN(d.getTime())?null:d;
}
function toInput(v){
  var d=parseDate(v); if(!d) return "";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysFromToday(v){
  var d=parseDate(v); if(!d) return null;
  var t=new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function toast(msg,bad){
  var t=document.getElementById("toast");
  t.textContent=msg; t.className="toast on"+(bad?" bad":"");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className="toast"; },2800);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function statusPill(v){
  var s=String(v||"").trim(), c="neut";
  if(/^(Live|Completed|Paid|Verified|Active|Replaced)$/i.test(s)) c="live";
  else if(/^(Removed|Failed|Overdue|Blacklisted|Cancelled)$/i.test(s)) c="fail";
  else if(/^(Pending|Unpaid|In Progress|Submitted|Awaiting Payment|Replacement Requested|On Hold|Partial|Testing|Assigned|Ready|New|Partially Delivered)$/i.test(s)) c="warn";
  else if(/^(Backup|Paused|Inactive)$/i.test(s)) c="info";
  return '<span class="pill '+c+'">'+esc(s||"—")+'</span>';
}

/* Vendor lookups */
function vendorName(id){
  var v=rows("vendors").filter(function(r){ return r["Vendor ID"]===id; })[0];
  return v ? v["Vendor Name"] : id;
}
function vendorScore(id){
  var v=rows("vendors").filter(function(r){ return r["Vendor ID"]===id; })[0];
  if(!v) return null;
  var q=num(v["Quality Rating"]), r=num(v["Reliability Rating"]), c=num(v["Communication Rating"]);
  if(!q&&!r&&!c) return null;
  return ((q+r+c)/3);
}
function clientName(id){
  var c=rows("clients").filter(function(r){ return r["Client ID"]===id; })[0];
  return c ? c["Client Name"] : id;
}

/* ============================================================
   Derived metrics
   ============================================================ */
function vendorStats(){
  var out={};
  rows("vendors").forEach(function(v){
    out[v["Vendor ID"]]={ id:v["Vendor ID"], name:v["Vendor Name"], status:v["Status"],
      orders:0, done:0, deliv:0, live:0, removed:0, failed:0, score:vendorScore(v["Vendor ID"]) };
  });
  rows("orders").forEach(function(o){
    var s=out[o["Vendor"]]; if(!s) return;
    s.orders++; if(/completed/i.test(o["Status"]||"")) s.done++;
  });
  rows("deliverables").forEach(function(d){
    var s=out[d["Vendor"]]; if(!s) return;
    s.deliv++;
    var st=String(d["Status"]||"");
    if(/^(Live|Verified|Replaced)$/i.test(st)) s.live++;
    else if(/^Removed$/i.test(st)) s.removed++;
    else if(/^Failed$/i.test(st)) s.failed++;
  });
  Object.keys(out).forEach(function(k){
    var s=out[k];
    var settled=s.live+s.removed+s.failed;
    s.successRate = settled ? (s.live/settled)*100 : null;
    s.removalRate = s.deliv ? (s.removed/s.deliv)*100 : null;
    s.verdict = s.successRate==null ? "No data"
              : s.successRate>=90 ? "Reliable"
              : s.successRate>=70 ? "Watch" : "Replace";
  });
  return out;
}

/** Builds the coverage grid from who actually delivers what. */
function coverage(){
  var stats=vendorStats();
  var pairs={};

  // seed from the service catalog
  rows("services").forEach(function(s){
    var key=(s["Platform"]||"")+"|"+(s["Service Name"]||"");
    if(!s["Platform"]) return;
    pairs[key]=pairs[key]||{platform:s["Platform"],service:s["Service Name"]||"—",vendors:{}};
    [s["Default Vendor"],s["Backup Vendor"]].forEach(function(v){ if(v) pairs[key].vendors[v]=true; });
  });
  // add anything vendors say they cover
  rows("vendors").forEach(function(v){
    if(!/^(Active|Backup|Testing)$/i.test(v["Status"]||"")) return;
    String(v["Platforms Offered"]||"").split(",").map(function(p){return p.trim();}).filter(Boolean).forEach(function(p){
      var svc=v["Primary Service"]||"—";
      var key=p+"|"+svc;
      pairs[key]=pairs[key]||{platform:p,service:svc,vendors:{}};
      pairs[key].vendors[v["Vendor ID"]]=true;
    });
  });

  return Object.keys(pairs).map(function(k){
    var p=pairs[k];
    var list=Object.keys(p.vendors).filter(function(id){ return stats[id]; })
      .sort(function(a,b){ return (stats[b].score||0)-(stats[a].score||0); });
    return { platform:p.platform, service:p.service, vendors:list, stats:stats };
  }).sort(function(a,b){
    if(a.vendors.length!==b.vendors.length) return a.vendors.length-b.vendors.length;
    return a.platform.localeCompare(b.platform);
  });
}

function attention(){
  var items=[];

  rows("deliverables").forEach(function(d){
    if(/^Removed$/i.test(d["Status"]||"")){
      items.push({sev:"fail",tag:"Removed",
        title:d["Deliverable ID"]+" on "+(d["Platform"]||"—")+" is down",
        meta:vendorName(d["Vendor"])+" · order "+(d["Order ID"]||"—")+(d["Removal Reason"]?" · "+d["Removal Reason"]:"")+" · needs a replacement",
        go:"deliverables"});
    }
    if(/^Replacement Requested$/i.test(d["Status"]||"")){
      items.push({sev:"warn",tag:"Waiting",
        title:"Replacement requested for "+d["Deliverable ID"],
        meta:vendorName(d["Vendor"])+" hasn't delivered the swap yet",go:"deliverables"});
    }
  });

  rows("orders").forEach(function(o){
    if(/^(Completed|Cancelled)$/i.test(o["Status"]||"")) return;
    var dd=daysFromToday(o["Deadline"]);
    if(dd===null) return;
    if(dd<0) items.push({sev:"fail",tag:"Overdue",
      title:o["Order ID"]+" is "+Math.abs(dd)+" day"+(Math.abs(dd)===1?"":"s")+" past deadline",
      meta:clientName(o["Client ID"])+" · "+(o["Platform"]||"")+" · "+vendorName(o["Vendor"]),go:"orders"});
    else if(dd<=3) items.push({sev:"warn",tag:"Due soon",
      title:o["Order ID"]+" is due in "+dd+" day"+(dd===1?"":"s"),
      meta:clientName(o["Client ID"])+" · "+(o["Platform"]||"")+" · "+vendorName(o["Vendor"]),go:"orders"});
  });

  rows("invoices").forEach(function(i){
    var owed=num(i["Amount"])-num(i["Amount Received"]);
    var dd=daysFromToday(i["Due Date"]);
    if(owed>0 && dd!==null && dd<0) items.push({sev:"fail",tag:"Unpaid",
      title:clientName(i["Client"])||i["Client"],
      meta:money(owed)+" outstanding, "+Math.abs(dd)+" day"+(Math.abs(dd)===1?"":"s")+" overdue · "+i["Invoice ID"],go:"money"});
  });

  rows("bills").forEach(function(b){
    var owed=num(b["Amount Owed"])-num(b["Amount Paid"]);
    var dd=daysFromToday(b["Due Date"]);
    if(owed>0 && dd!==null && dd<0) items.push({sev:"warn",tag:"You owe",
      title:vendorName(b["Vendor"]),
      meta:money(owed)+" due "+Math.abs(dd)+" day"+(Math.abs(dd)===1?"":"s")+" ago · "+b["Payment ID"],go:"money"});
  });

  var stats=vendorStats();
  Object.keys(stats).forEach(function(k){
    var s=stats[k];
    if(s.removalRate!==null && s.removalRate>15 && s.deliv>=3){
      items.push({sev:"warn",tag:"Vendor",
        title:s.name+" is losing "+Math.round(s.removalRate)+"% of placements",
        meta:s.removed+" of "+s.deliv+" removed · line up a backup before the next order",go:"vendors"});
    }
  });

  coverage().forEach(function(c){
    if(c.vendors.length<=1) items.push({sev:"info",tag:"Coverage",
      title:c.platform+" "+c.service+(c.vendors.length?" has no backup":" has no vendor"),
      meta:c.vendors.length?"Only "+vendorName(c.vendors[0])+" can deliver this":"Nobody on the roster covers it",go:"coverage"});
  });

  var order={fail:0,warn:1,info:2};
  return items.sort(function(a,b){ return order[a.sev]-order[b.sev]; });
}

function moneyThisMonth(){
  var now=new Date(), m=now.getMonth(), y=now.getFullYear();
  var rev=0,cost=0;
  rows("orders").forEach(function(o){
    var d=parseDate(o["Order Date"]); if(!d||d.getMonth()!==m||d.getFullYear()!==y) return;
    rev+=num(o["Client Price"]); cost+=num(o["Vendor Cost"]);
  });
  var recv=0;
  rows("invoices").forEach(function(i){ recv+=Math.max(0,num(i["Amount"])-num(i["Amount Received"])); });
  var owe=0;
  rows("bills").forEach(function(b){ owe+=Math.max(0,num(b["Amount Owed"])-num(b["Amount Paid"])); });
  return {rev:rev,cost:cost,profit:rev-cost,receivable:recv,payable:owe};
}

function renderNav(){
  var nav=document.getElementById("nav"); nav.innerHTML="";
  NAV.forEach(function(n){
    if(n.grp!==undefined){ if(n.grp) nav.appendChild(el("div",{class:"grp",text:n.grp})); return; }
    var kids=[el("span",{text:n.label})];
    if(n.count && CFG.url){
      var c=0; try{ c=n.count(); }catch(e){}
      if(c) kids.push(el("span",{class:"ct",text:String(c)}));
    }
    nav.appendChild(el("a",{href:"#"+n.id,class:VIEW===n.id?"on":""},kids));
  });
}

/* ============================================================
   Views
   ============================================================ */
function render(){
  renderNav();
  var v=document.getElementById("view"); v.innerHTML="";
  var sc=document.getElementById("searchWrap"), add=document.getElementById("addBtn");
  sc.style.display="none"; add.style.display="none";

  if(VIEW==="settings"){ title("Settings","Point the dashboard at your Sheet"); return viewSettings(v); }
  if(!CFG.url){ title("Welcome","One step before anything loads"); return viewOnboard(v); }

  if(VIEW==="board"){ title("Board","What needs a decision today"); return viewBoard(v); }
  if(VIEW==="coverage"){ title("Coverage","Where a single vendor dropping out would hurt"); return viewCoverage(v); }
  if(VIEW==="money"){ title("Payments","Money in from clients, money out to vendors"); return viewMoney(v); }

  if(SCHEMA[VIEW]){
    var s=SCHEMA[VIEW];
    title(s.label, rows(VIEW).length+" record"+(rows(VIEW).length===1?"":"s")+" in the Sheet");
    sc.style.display=""; add.style.display="";
    add.textContent="Add "+s.singular;
    return viewTable(v,VIEW);
  }
  VIEW="board"; render();
}

/* ---------- board ---------- */
function viewBoard(v){
  var m=moneyThisMonth();
  var items=attention();
  var open=rows("orders").filter(function(o){ return !/^(Completed|Cancelled)$/i.test(o["Status"]||""); }).length;
  var live=rows("deliverables").filter(function(d){ return /^(Live|Verified|Replaced)$/i.test(d["Status"]||""); }).length;
  var gone=rows("deliverables").filter(function(d){ return /^Removed$/i.test(d["Status"]||""); }).length;
  var thin=coverage().filter(function(c){ return c.vendors.length<=1; }).length;

  var counters=el("div",{class:"counters"});
  [
    {n:items.filter(function(i){return i.sev==="fail";}).length,l:"Need action now",cls:"alert"},
    {n:open,l:"Open orders"},
    {n:live,l:"Placements live",cls:"good"},
    {n:gone,l:"Removed",cls:gone?"alert":""},
    {n:thin,l:"Single-vendor services",cls:thin?"warn":""},
    {n:money(m.receivable),l:"Clients owe you"},
    {n:money(m.payable),l:"You owe vendors"}
  ].forEach(function(c){
    counters.appendChild(el("div",{class:"counter "+(c.cls||"")},[
      el("div",{class:"n",text:String(c.n)}), el("div",{class:"l",text:c.l})
    ]));
  });
  v.appendChild(counters);

  var q=el("ul",{class:"q"});
  if(!items.length){
    q=el("div",{class:"empty"},[el("b",{text:"Nothing needs you right now"}),
      el("div",{text:"No overdue orders, no removed placements, no late payments."})]);
  } else {
    items.slice(0,14).forEach(function(i){
      q.appendChild(el("li",{},[
        el("div",{class:"tag "+i.sev,text:i.tag}),
        el("div",{class:"txt"},[el("b",{text:i.title}),el("div",{class:"meta",text:i.meta})]),
        el("button",{class:"btn sm",onclick:function(){ location.hash="#"+i.go; }},["Open"])
      ]));
    });
  }
  v.appendChild(el("div",{class:"panel"},[
    el("header",{},[el("h2",{text:"Needs attention"}),el("div",{class:"spacer"}),
      el("span",{class:"note",text:items.length?items.length+" items, worst first":"All clear"})]),
    q
  ]));

  // this month
  v.appendChild(el("div",{class:"panel"},[
    el("header",{},[el("h2",{text:"This month"}),el("div",{class:"spacer"}),
      el("span",{class:"note",text:"Based on order dates in the current calendar month"})]),
    el("div",{class:"body"},[
      el("div",{class:"counters",style:"margin:0;border:0"},[
        el("div",{class:"counter"},[el("div",{class:"n",text:money(m.rev)}),el("div",{class:"l",text:"Billed to clients"})]),
        el("div",{class:"counter"},[el("div",{class:"n",text:money(m.cost)}),el("div",{class:"l",text:"Vendor cost"})]),
        el("div",{class:"counter good"},[el("div",{class:"n",text:money(m.profit)}),el("div",{class:"l",text:"Gross profit"})]),
        el("div",{class:"counter"},[el("div",{class:"n",text:(m.rev?Math.round(m.profit/m.rev*100):0)+"%"}),el("div",{class:"l",text:"Margin"})])
      ])
    ])
  ]));

  // vendor scoreboard
  var stats=vendorStats();
  var list=Object.keys(stats).map(function(k){return stats[k];})
    .filter(function(s){ return s.deliv>0 || s.orders>0; })
    .sort(function(a,b){ return (b.successRate||0)-(a.successRate||0); });

  var t=el("table"), tb=el("tbody");
  t.appendChild(el("thead",{},[el("tr",{},[
    el("th",{text:"Vendor"}),el("th",{text:"Status"}),el("th",{class:"num",text:"Orders"}),
    el("th",{class:"num",text:"Live"}),el("th",{class:"num",text:"Removed"}),
    el("th",{class:"num",text:"Success"}),el("th",{class:"num",text:"Score"}),el("th",{text:"Verdict"})
  ])]));
  if(!list.length){
    tb.appendChild(el("tr",{},[el("td",{colspan:"8"},[el("div",{class:"empty"},[
      el("b",{text:"No delivery history yet"}),
      el("div",{text:"Log a few deliverables and vendor reliability starts scoring itself."})])])]));
  }
  list.forEach(function(s){
    var verdictCls = s.verdict==="Reliable"?"live":s.verdict==="Watch"?"warn":s.verdict==="Replace"?"fail":"neut";
    tb.appendChild(el("tr",{},[
      el("td",{},[el("b",{text:s.name||s.id})]),
      el("td",{html:statusPill(s.status)}),
      el("td",{class:"num",text:String(s.orders)}),
      el("td",{class:"num",text:String(s.live)}),
      el("td",{class:"num",text:String(s.removed)}),

      el("td",{class:"num",text:s.score==null?"—":s.score.toFixed(1)}),
      el("td",{html:'<span class="pill '+verdictCls+'">'+s.verdict+"</span>"})
    ]));
  });
  t.appendChild(tb);
  v.appendChild(el("div",{class:"panel"},[
    el("header",{},[el("h2",{text:"Vendor scoreboard"}),el("div",{class:"spacer"}),
      el("span",{class:"note",text:"Success counts live placements against removed and failed ones"})]),
    el("div",{class:"scroll"},[t])
  ]));
}

/* ---------- coverage ---------- */
function viewCoverage(v){
  var cov=coverage();
  var grid=el("div",{class:"cov"});
  grid.appendChild(el("div",{class:"cov-row head"},[
    el("div",{text:"Platform"}),el("div",{text:"Service"}),
    el("div",{text:"Primary and backups"}),el("div",{style:"text-align:right",text:"Exposure"})
  ]));

  if(!cov.length){
    grid.appendChild(el("div",{class:"empty"},[el("b",{text:"No coverage to map yet"}),
      el("div",{text:"Add vendors with their platforms, or fill in the service catalog."})]));
  }

  cov.forEach(function(c){
    var slots=el("div",{class:"slots"});
    var n=Math.max(3,c.vendors.length);
    for(var i=0;i<n;i++){
      var id=c.vendors[i];
      if(id){
        var s=c.stats[id];
        var bits=[el("span",{class:"who",text:s.name||id})];
        var det=[];
        if(s.score!=null) det.push(s.score.toFixed(1)+" score");
        if(s.successRate!=null) det.push(Math.round(s.successRate)+"% live");
        bits.push(el("span",{class:"sc",text:det.length?det.join(" · "):(s.status||"No history")}));
        slots.appendChild(el("div",{class:"slot filled"},bits));
      } else {
        slots.appendChild(el("div",{class:"slot empty",text:i===0?"nobody":"open slot"}));
      }
    }
    var risk = c.vendors.length===0 ? {t:"No cover",c:"bare"}
             : c.vendors.length===1 ? {t:"Single point of failure",c:"bare"}
             : c.vendors.length===2 ? {t:"Thin",c:"thin"}
             : {t:"Covered",c:"ok"};
    grid.appendChild(el("div",{class:"cov-row"},[
      el("div",{class:"cov-plat",text:c.platform}),
      el("div",{class:"cov-svc",text:c.service}),
      slots,
      el("div",{class:"cov-risk "+risk.c,text:risk.t})
    ]));
  });

  v.appendChild(el("div",{class:"panel"},[
    el("header",{},[el("h2",{text:"Vendor redundancy"}),el("div",{class:"spacer"}),
      el("span",{class:"note",text:"Rows are ordered by how exposed you are, thinnest first"})]),
    grid
  ]));

  v.appendChild(el("div",{class:"panel"},[
    el("div",{class:"body",style:"color:#4a5b6b;font-size:13px"},[
      "Slots fill from the service catalog and from each vendor's own platform list. To add a backup, either give a vendor that platform on their record or set them as the backup on the matching service."
    ])
  ]));
}

/* ---------- money ---------- */
var MONEY_TAB="invoices";
function viewMoney(v){
  var tabs=el("div",{class:"tabs"});
  [["invoices","Client invoices"],["bills","Vendor bills"]].forEach(function(p){
    tabs.appendChild(el("button",{class:MONEY_TAB===p[0]?"on":"",onclick:function(){ MONEY_TAB=p[0]; render(); }},[p[1]]));
  });

  var recv=0,owe=0;
  rows("invoices").forEach(function(i){ recv+=Math.max(0,num(i["Amount"])-num(i["Amount Received"])); });
  rows("bills").forEach(function(b){ owe+=Math.max(0,num(b["Amount Owed"])-num(b["Amount Paid"])); });

  var counters=el("div",{class:"counters"});
  [{n:money(recv),l:"Outstanding from clients",cls:recv?"warn":"good"},
   {n:money(owe),l:"Outstanding to vendors",cls:owe?"warn":"good"},
   {n:money(recv-owe),l:"Net position",cls:(recv-owe)>=0?"good":"alert"}].forEach(function(c){
    counters.appendChild(el("div",{class:"counter "+c.cls},[el("div",{class:"n",text:c.n}),el("div",{class:"l",text:c.l})]));
  });
  v.appendChild(counters);

  var panel=el("div",{class:"panel"},[
    el("header",{},[el("h2",{text:MONEY_TAB==="invoices"?"Money in":"Money out"}),el("div",{class:"spacer"}),
      el("button",{class:"btn pri",onclick:function(){ openForm(MONEY_TAB,null); }},["Add "+SCHEMA[MONEY_TAB].singular])]),
    tabs
  ]);
  panel.appendChild(buildTable(MONEY_TAB,true));
  v.appendChild(panel);
}

/* ---------- generic table ---------- */
function viewTable(v,key){
  v.appendChild(el("div",{class:"panel"},[buildTable(key,false)]));
}

function buildTable(key,inPanel){
  var s=SCHEMA[key];
  var all=rows(key);
  var data=all;
  if(FILTER){
    var q=FILTER.toLowerCase();
    data=all.filter(function(r){
      return Object.keys(r).some(function(k){ return k!=="__row" && String(r[k]).toLowerCase().indexOf(q)>-1; });
    });
  }

  var wrap=el("div",{class:"scroll"});
  var t=el("table"), tb=el("tbody");
  var head=el("tr");
  s.cols.forEach(function(c){ head.appendChild(el("th",{class:isNumCol(s,c)?"num":"",text:c})); });
  head.appendChild(el("th",{style:"width:64px"}));
  t.appendChild(el("thead",{},[head]));

  if(!data.length){
    tb.appendChild(el("tr",{},[el("td",{colspan:String(s.cols.length+1)},[
      el("div",{class:"empty"},[
        el("b",{text:all.length?"Nothing matches that filter":"No "+s.label.toLowerCase()+" yet"}),
        el("div",{text:all.length?"Try a shorter search term.":"Add the first one and it writes straight to the Sheet."}),
        all.length?null:el("button",{class:"btn pri",onclick:function(){ openForm(key,null); }},["Add "+s.singular])
      ])
    ])]));
  }

  data.forEach(function(r){
    var tr=el("tr");
    s.cols.forEach(function(c){
      var raw=r[c];
      var td;
      if(/^(Status|Campaign Status|Client Payment|Vendor Payment|Payment Status)$/.test(c)){
        td=el("td",{html:statusPill(raw)});
      } else if(c==="Vendor"||c==="Default Vendor"||c==="Backup Vendor"){
        td=el("td",{text:raw?vendorName(raw):"—"});
      } else if(c==="Client Name"){
        td=el("td",{text:r["Client Name"]||clientName(r["Client ID"])||"—"});
      } else if(c==="Live URL"){
        td=el("td",{});
        if(raw) td.appendChild(el("a",{href:raw,target:"_blank",rel:"noopener",class:"trunc",text:raw.replace(/^https?:\/\//,"")}));
        else td.textContent="—";
      } else if(/(Cost|Price|Amount|Budget|Base Cost|Price Per Unit)/.test(c)){
        td=el("td",{class:"num",text:raw?money(raw):"—"});
      } else if(c==="Overall Score"){
        var sc=vendorScore(r["Vendor ID"]);
        td=el("td",{class:"num",text:sc==null?"—":sc.toFixed(1)});
      } else if(c==="Deadline"){
        var dd=daysFromToday(raw);
        td=el("td",{});
        td.appendChild(document.createTextNode(raw||"—"));
        if(dd!==null && !/^(Completed|Cancelled)$/i.test(r["Status"]||"")){
          if(dd<0) td.appendChild(el("div",{class:"pill fail",style:"margin-top:3px",text:Math.abs(dd)+"d late"}));
          else if(dd<=3) td.appendChild(el("div",{class:"pill warn",style:"margin-top:3px",text:"in "+dd+"d"}));
        }
      } else if(c.indexOf("ID")>-1){
        td=el("td",{class:"mono-id",text:raw||"—"});
      } else {
        td=el("td",{});
        td.appendChild(el("span",{class:"trunc",text:raw===""||raw==null?"—":String(raw)}));
      }
      tr.appendChild(td);
    });
    tr.appendChild(el("td",{class:"act"},[
      el("button",{class:"btn sm",onclick:function(){ openForm(key,r); }},["Edit"])
    ]));
    tb.appendChild(tr);
  });

  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

function isNumCol(s,c){ return /(Cost|Price|Amount|Quantity|Score|Budget|Days)/.test(c); }

/* ============================================================
   Form modal
   ============================================================ */
var FORM={key:null,row:null};

function openForm(key,row){
  FORM.key=key; FORM.row=row;
  var s=SCHEMA[key];
  document.getElementById("modalTitle").textContent=(row?"Edit ":"New ")+s.singular;
  document.getElementById("deleteRow").style.display=row?"":"none";

  var box=document.getElementById("modalFields"); box.innerHTML="";
  s.fields.forEach(function(f){
    if(f.ro && !row) return; // hide auto-ID on create
    var wrap=el("div",{class:"field"+(f.wide||f.t===T.area?" wide":"")});
    wrap.appendChild(el("label",{text:f.k+(f.req?" *":"")}));

    var input, val=row?(row[f.k]||""):"";

    if(f.t===T.sel && f.ref){
      input=el("select");
      input.appendChild(el("option",{value:"",text:"— none —"}));
      refOptions(f.ref).forEach(function(o){
        var op=el("option",{value:o.id,text:o.label});
        if(String(val)===String(o.id)) op.selected=true;
        input.appendChild(op);
      });
    } else if(f.t===T.sel){
      input=el("select");
      (f.opts||[]).forEach(function(o){
        var op=el("option",{value:o,text:o||"— none —"});
        if(String(val)===String(o)) op.selected=true;
        input.appendChild(op);
      });
      if(!f.opts.some(function(o){return String(o)===String(val);}) && val){
        input.appendChild(el("option",{value:val,text:val,selected:"selected"}));
      }
    } else if(f.t===T.area){
      input=el("textarea"); input.value=val;
    } else if(f.t===T.date){
      input=el("input",{type:"date"}); input.value=toInput(val);
    } else {
      input=el("input",{type:f.t===T.num?"number":f.t===T.email?"email":f.t===T.url?"url":f.t===T.tel?"tel":"text"});
      if(f.t===T.num) input.step="any";
      input.value=val;
    }

    input.dataset.k=f.k;
    if(f.ro) input.disabled=true;
    if(f.req) input.required=true;
    wrap.appendChild(input);
    if(f.hint) wrap.appendChild(el("span",{class:"hint",text:f.hint}));
    box.appendChild(wrap);
  });

  document.getElementById("veil").classList.add("on");
  var first=box.querySelector("input:not([disabled]),select,textarea");
  if(first) first.focus();
}

function refOptions(ref){
  if(ref==="vendors") return rows("vendors").map(function(v){ return {id:v["Vendor ID"],label:v["Vendor Name"]+" · "+(v["Status"]||"")}; });
  if(ref==="clients") return rows("clients").map(function(c){ return {id:c["Client ID"],label:c["Client Name"]}; });
  if(ref==="orders")  return rows("orders").map(function(o){ return {id:o["Order ID"],label:o["Order ID"]+" · "+clientName(o["Client ID"])+" · "+(o["Platform"]||"")}; });
  return [];
}

function closeForm(){ document.getElementById("veil").classList.remove("on"); FORM.key=null; FORM.row=null; }

function collectForm(){
  var out={};
  document.querySelectorAll("#modalFields [data-k]").forEach(function(i){
    out[i.dataset.k]=i.value;
  });
  return out;
}

function saveForm(){
  var s=SCHEMA[FORM.key];
  var payload=collectForm();

  var missing=s.fields.filter(function(f){ return f.req && !f.ro && !String(payload[f.k]||"").trim(); });
  if(missing.length){ toast("Fill in "+missing[0].k,true); return; }

  var btn=document.getElementById("saveRow");
  btn.disabled=true; btn.textContent="Saving";

  var idKey=s.fields[0].k;
  var req = FORM.row
    ? {action:"update",sheet:s.sheet,id:FORM.row[idKey],row:payload}
    : {action:"create",sheet:s.sheet,row:payload};

  api(req).then(function(){
    return loadAll();
  }).then(function(){
    closeForm(); render();
    toast(FORM.row?"Saved to the Sheet.":"Added to the Sheet.");
  }).catch(function(e){
    toast(e.message,true);
  }).then(function(){
    btn.disabled=false; btn.textContent="Save";
  });
}

function deleteForm(){
  if(!FORM.row) return;
  var s=SCHEMA[FORM.key];
  var idKey=s.fields[0].k, id=FORM.row[idKey];
  if(!confirm("Delete "+id+"? This removes the row from the Sheet and can't be undone.")) return;

  api({action:"delete",sheet:s.sheet,id:id})
    .then(loadAll)
    .then(function(){ closeForm(); render(); toast("Deleted "+id+"."); })
    .catch(function(e){ toast(e.message,true); });
}

/* ============================================================
   Wiring
   ============================================================ */
document.getElementById("saveRow").addEventListener("click",saveForm);
document.getElementById("deleteRow").addEventListener("click",deleteForm);
document.getElementById("cancelModal").addEventListener("click",closeForm);
document.getElementById("closeModal").addEventListener("click",closeForm);
document.getElementById("veil").addEventListener("click",function(e){ if(e.target===this) closeForm(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeForm(); });

document.getElementById("addBtn").addEventListener("click",function(){ if(SCHEMA[VIEW]) openForm(VIEW,null); });
document.getElementById("refreshBtn").addEventListener("click",function(){
  if(!CFG.url){ location.hash="#settings"; return; }
  var b=this; b.disabled=true; b.textContent="Loading";
  loadAll().then(function(){ render(); toast("Reloaded from the Sheet."); })
    .catch(function(e){ toast(e.message,true); })
    .then(function(){ b.disabled=false; b.textContent="Refresh"; });
});
document.getElementById("search").addEventListener("input",function(){
  FILTER=this.value.trim();
  var v=document.getElementById("view"); v.innerHTML=""; viewTable(v,VIEW);
});

window.addEventListener("hashchange",function(){
  VIEW=location.hash.slice(1)||"board"; FILTER="";
  document.getElementById("search").value="";
  render();
});

/* boot */
VIEW=location.hash.slice(1)||"board";
if(CFG.url){
  loadAll().then(render).catch(function(e){ toast(e.message,true); render(); });
} else {
  render();
}
</script>
